<!DOCTYPE html>

    <title>Sitio Personal - Leyder</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

        <h1>Leyder C.</h1>

    <footer class="footer">
        <p>&copy; 2026 - Leyder Cerón | Todos los derechos reservados</p>

    <!-- Script de física para el movimiento flotante -->
